    bn: "TODO-VERIFY: আখি ফার্নিচারের লিখিত ওয়ারেন্টির শর্তের অপেক্ষায়।"

- id: outside-dhaka
  group: delivery
  order: 1
  showOn: [custom]
  status: published
  question:
    en: "Do you deliver outside Dhaka?"
    bn: "ঢাকার বাইরে ডেলিভারি দেন?"
  answer:
    en: "Ask us on WhatsApp with your area and we will tell you what is possible."
    bn: "আপনার এলাকা জানিয়ে হোয়াটসঅ্যাপে জিজ্ঞেস করুন, কী সম্ভব আমরা জানাব।"

- id: set-up
  group: delivery
  order: 2
  status: draft
  question:
    en: "Do you set up the furniture?"
    bn: "আসবাব কি জায়গামতো বসিয়ে দেন?"
  answer:
    en: "TODO-VERIFY: waiting for AKHI to confirm installation details."
    bn: "TODO-VERIFY: স্থাপনের বিস্তারিত নিশ্চিত হওয়ার অপেক্ষায়।"

- id: see-before
  group: showroom
  order: 1
  showOn: [design]
  status: published
  question:
    en: "Can I see a piece before ordering?"
    bn: "অর্ডারের আগে কি আসবাবটি দেখা যাবে?"
  answer:
    en: "Visit our showroom in Bashundhara to see our work in person."
    bn: "বসুন্ধরায় আমাদের শোরুমে এসে আমাদের কাজ নিজের চোখে দেখুন।"

- id: appointment
  group: showroom
  order: 2
  status: published
  question:
    en: "Do I need an appointment?"
    bn: "অ্যাপয়েন্টমেন্ট লাগবে কি?"
  answer:
    en: "Message or call us before you come, so we can make sure the right person is there to help you."
    bn: "আসার আগে মেসেজ বা ফোন করুন, যাতে আপনাকে সাহায্য করার জন্য সঠিক মানুষটি উপস্থিত থাকেন।"

- id: what-to-bring
  group: showroom
  order: 3
  status: published
  question:
    en: "What should I bring?"
    bn: "সঙ্গে কী আনব?"
  answer:
    en: "Room measurements and a few photos of your space help us give useful advice."
    bn: "ঘরের মাপ আর কয়েকটি ছবি থাকলে আমরা কাজের পরামর্শ দিতে পারি।"

- id: large-orders
  group: business
  order: 1
  status: draft
  question:
    en: "Do you take large office orders?"
    bn: "অফিসের বড় অর্ডার নেন?"
  answer:
    en: "Yes. We visit the site, prepare drawings and give one quote for the whole order."
    bn: "হ্যাঁ। আমরা সাইট দেখি, ড্রয়িং তৈরি করি আর পুরো অর্ডারের জন্য একটি কোটেশন দিই।"

- id: quote-by-email
  group: business
  order: 2
  status: draft
  question:
    en: "Can I get the quote by email?"
    bn: "ইমেইলে কোটেশন পাওয়া যাবে?"
  answer:
    en: "Yes, send your requirements to our email and we will reply there."
    bn: "হ্যাঁ, আমাদের ইমেইলে প্রয়োজনগুলো পাঠান, সেখানেই উত্তর দেব।"
