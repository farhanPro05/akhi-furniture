# FAQ (Master Plan §7.10). Published answers promise nothing AKHI hasn't confirmed (no hours, timelines,
# delivery terms or warranty). status: draft hides a question until AKHI gives the real answer
# (warranty, installation, office orders). See plans/2026-10-11-launch-cleanup-and-unconfirmed-items.md.
# showOn adds a question to the short FAQ on design pages and/or the Custom Furniture page.

- id: why-no-prices
  group: custom
  order: 1
  showOn: [design, custom]
  status: published
  question:
    en: "Why don't you show prices online?"
    bn: "অনলাইনে দাম কেন দেওয়া নেই?"
  answer:
    en: "The price depends on the size, material and finish you choose, so we quote once we understand what you need. Message us on WhatsApp with a photo or a design code."
    bn: "দাম নির্ভর করে আপনার বেছে নেওয়া মাপ, ম্যাটেরিয়াল ও ফিনিশের ওপর, তাই আপনার প্রয়োজন বুঝে আমরা দাম জানাই। ছবি বা ডিজাইন কোডসহ হোয়াটসঅ্যাপে মেসেজ করুন।"

- id: change-size
  group: custom
  order: 2
  showOn: [design]
  status: published
  question:
    en: "Can I change the size?"
    bn: "মাপ কি বদলানো যাবে?"
  answer:
    en: "Yes. Tell us your room size and how you will use the piece, and we will make it to fit."
    bn: "হ্যাঁ। ঘরের মাপ আর আসবাবটি কীভাবে ব্যবহার করবেন জানালে সেই অনুযায়ী বানিয়ে দেব।"

- id: copy-from-photo
  group: custom
  order: 3
  showOn: [custom]
  status: published
  question:
    en: "Can you make a design I found online?"
    bn: "অনলাইনে দেখা কোনো ডিজাইন কি বানিয়ে দিতে পারবেন?"
  answer:
    en: "Send us the photo. We will tell you what we can make and how we would adapt it to your room."
    bn: "ছবিটা পাঠান। আমরা জানাব কী বানানো সম্ভব আর আপনার ঘরের জন্য কীভাবে মানিয়ে নেব।"

- id: how-long
  group: custom
  order: 4
  showOn: [custom]
  status: published
  question:
    en: "How long does a custom piece take?"
    bn: "একটি কাস্টম আসবাব বানাতে কত সময় লাগে?"
  answer:
    en: "It depends on the piece and the material. Ask us when you discuss your order."
    bn: "আসবাব আর ম্যাটেরিয়ালের ওপর নির্ভর করে। অর্ডার নিয়ে কথা বলার সময় আমাদের জিজ্ঞেস করুন।"

- id: which-woods
  group: materials
  order: 1
  status: published
  question:
    en: "Which woods do you use?"
    bn: "কোন কাঠ ব্যবহার করেন?"
  answer:
    en: "We mostly work with wood and board. Tell us what you have in mind and we will talk through the options for your piece."
    bn: "আমরা মূলত কাঠ ও বোর্ড দিয়ে কাজ করি। আপনার পছন্দ জানালে আপনার আসবাবের জন্য অপশনগুলো নিয়ে কথা বলব।"

