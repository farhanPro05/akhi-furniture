# FAQ (Master Plan §7.10). Every answer needs AKHI's confirmation before launch.
# status: draft hides a question until AKHI gives the real answer (warranty, delivery, installation).
# showOn adds a question to the short FAQ on design pages and/or the Custom Furniture page.

- id: why-no-prices
  group: custom
  order: 1
  showOn: [design, custom]
  status: published
  question:
    en: "Why don't you show prices online?"
    bn: "অনলাইনে দাম কেন দেওয়া নেই?"
  answer:
    en: "Every piece is made to your size, material and finish, so we give you an exact quote once we understand what you need. Message us on WhatsApp for a quick estimate."
    bn: "প্রতিটি আসবাব আপনার মাপ, ম্যাটেরিয়াল ও ফিনিশ অনুযায়ী তৈরি হয়, তাই আপনার প্রয়োজন বুঝে আমরা সঠিক দাম জানাই। দ্রুত ধারণা পেতে হোয়াটসঅ্যাপে মেসেজ করুন।"

- id: change-size
  group: custom
  order: 2
  showOn: [design]
  status: published
  question:
    en: "Can I change the size?"
    bn: "মাপ কি বদলানো যাবে?"
  answer:
    en: "Yes. Tell us your room size and how you will use the piece, and we will make it to fit."
    bn: "হ্যাঁ। ঘরের মাপ আর আসবাবটি কীভাবে ব্যবহার করবেন জানালে সেই অনুযায়ী বানিয়ে দেব।"

- id: copy-from-photo
  group: custom
  order: 3
  showOn: [custom]
  status: published
  question:
    en: "Can you make a design I found online?"
    bn: "অনলাইনে দেখা কোনো ডিজাইন কি বানিয়ে দিতে পারবেন?"
  answer:
    en: "Send us the photo. We will tell you what we can make and how we would adapt it to your room."
    bn: "ছবিটা পাঠান। আমরা জানাব কী বানানো সম্ভব আর আপনার ঘরের জন্য কীভাবে মানিয়ে নেব।"

- id: how-long
  group: custom
  order: 4
  showOn: [custom]
  status: published
  question:
    en: "How long does a custom piece take?"
    bn: "একটি কাস্টম আসবাব বানাতে কত সময় লাগে?"
  answer:
    en: "It depends on the piece and the wood. You get a clear timeline with your quote."
    bn: "আসবাব আর কাঠের ওপর নির্ভর করে। দামের সঙ্গে পরিষ্কার সময়সূচিও পাবেন।"

- id: which-woods
  group: materials
  order: 1
  status: published
  question:
    en: "Which woods do you use?"
    bn: "কোন কাঠ ব্যবহার করেন?"
  answer:
    en: "We discuss material options during your consultation and show samples at the showroom."
    bn: "পরামর্শের সময় ম্যাটেরিয়ালের অপশন নিয়ে কথা বলি, আর শোরুমে স্যাম্পল দেখাই।"

- id: warranty
  group: materials
  order: 2
